# cspell:words  Biomed  fulltext
import:
  c: common.yml
  d: datasets.yml
hetionet_ddi:
  module: hetiopeft.models.ddi
  source: HeteroDDIModel
  call: from_data
  args:
    data:
      module: hetiopeft.utils
      source: extract_data_from_dataset
      args:
        - d.{hetionet}
    hidden_dim: 768
    dropout: c.{dropout}
    target_node_type: Compound
    use_peft: c.{use_peft}
    peft_in_dim: c.{peft_in_dim}
peft_pub_med_bert:
  module: hetiopeft.models.peft
  source: PEFTFeatureExtractor
  args:
    model_name: microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext
    device: c.{device}
